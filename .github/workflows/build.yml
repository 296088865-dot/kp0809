name: Build IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 显示环境
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: 构建
        run: |
          chmod +x build.sh
          ./build.sh

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: DumpViewer-ipa
          path: build/DumpViewer.ipa
          if-no-files-found: error
